description: >-
  ARRIS Group publishes no rate limits. This file previously carried a bulk-sweep scaffold
  (2026-05-04) asserting X-RateLimit-* response headers, a 429 exhaustion code and tiered
  10/100/1000 rpm limits for a "CommScope Developer API" — none of which ARRIS ever
  published, and none of which could be observed because there is no callable ARRIS host.
  Those fabricated values have been removed. ARRIS has not been an operating company since
  CommScope acquired it in 2019. An honest zero.
