description: >-
  ARRIS Group was a global telecommunications equipment company providing
  entertainment and communications solutions including broadband, video, and
  wireless products for service providers and consumers. ARRIS was acquired by
  CommScope in 2019, combining their broadband technology expertise with
  CommScope's infrastructure solutions. The combined company offers cable
  modem equipment, set-top boxes, network infrastructure, DOCSIS technology,
  and related telecommunications hardware and software platforms for cable
  operators, telcos, and internet service providers worldwide.
apis:
  - aid: arris-group:commscope-api
    name: ARRIS Group Developer Surface
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    description: >-
      ARRIS Group publishes no API. The entry is retained to record the measurement: probed
      2026-09-07, no OpenAPI, Swagger, AsyncAPI, GraphQL SDL, MCP endpoint, agent card or
      Postman collection was found on any host this record names, and no ARRIS developer host
      (developer.arris.com, api.arris.com, support.arris.com) resolves in DNS. ARRIS stopped
      being an independent publisher when CommScope acquired it in 2019; arris.com now 301s to
      www.vistancenetworks.com. The network APIs people associate with this brand — RUCKUS One,
      SmartZone, ICX RESTCONF, RUCKUS IoT on api.ruckus.cloud — are CommScope contracts and are
      profiled under the commscope-holding record, not duplicated here.
    humanURL: https://www.commscope.com/
    x-base-url: >-
      Deliberately absent. The only candidate any source names is https://www.commscope.com,
      which repair-api-bases.py flags as docs-host / no-usable-base — it is a marketing site,
      not an API host. Recording it as a baseURL would assert a callable ARRIS endpoint that
      does not exist.
    tags:
      - Telecommunications
      - Broadband
      - Network Management
      - DOCSIS
    properties:
      - type: Documentation
        url: https://www.commscope.com/solutions/
